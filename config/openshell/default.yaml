version: 1

# Default OpenShell sandbox policy: MLflow traces only; no public egress.
# Default POLICY_FILE in launch-openclaw.sh, CI validate-security, demo-reset,
# and demo backstage (Test C before Change 1). Post–Change 1 google egress:
# config/openshell/google-egress.yaml via demo-allow-google-egress.sh.

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /sandbox]
  read_write: [/sandbox/workspace, /tmp, /dev/null, /home]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # LLM inference (OpenShell 0.1.6+): authorized by the attached provider
  # profile (MaaS / NeMo hosts), not inference.local (removed upstream).
  # Provider-derived endpoints merge into the effective sandbox policy.

  mlflow_direct:
    name: rhoai-mlflow-direct-traces
    # L4 + tls:skip — Node does end-to-end TLS to MLflow (Bearer + /mlflow API root).
    # OpenShell 0.1.6 rejects tls:skip together with protocol: rest (schema).
    endpoints:
      # OpenShell 0.1.6+ DNS: short ".svc" returns ENOTFOUND inside the sandbox;
      # FQDN ".svc.cluster.local" resolves and connects (validated 2026-11-02).
      - host: "mlflow.redhat-ods-applications.svc.cluster.local"
        port: 8443
        tls: skip
    # node: OpenClaw gateway + mlflow-openclaw trace export (not curl — validation uses oc exec)
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/bin/node.* }
      - { path: /usr/local/bin/node }

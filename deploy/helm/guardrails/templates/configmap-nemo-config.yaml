{{- if .Values.guardrails.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.guardrails.configMapName }}
  namespace: {{ include "guardrails.namespace" . }}
  labels:
    {{- include "guardrails.labels" . | nindent 4 }}
data:
  config.yaml: |
    models:
      - type: main
        engine: openai
        model: {{ .Values.guardrails.modelName | quote }}
        # Without api_key_env_var, NeMo sets api_key=runtime-provided and
        # expects X-Authorization forwarding; MaaS then returns 401.
        api_key_env_var: OPENAI_API_KEY
        parameters:
          # NeMo Guardrails default LLM framework rejects 0.21-style
          # openai_api_base; use base_url (OpenAI-compatible).
          base_url: {{ .Values.guardrails.maasBaseUrl | quote }}
    rails:
      input:
        flows:
{{- range .Values.guardrails.rails.inputFlows }}
          - {{ . }}
{{- end }}
      output:
        flows:
{{- range .Values.guardrails.rails.outputFlows }}
          - {{ . }}
{{- end }}
        streaming:
          enabled: {{ .Values.guardrails.rails.outputStreaming.enabled }}
          stream_first: {{ .Values.guardrails.rails.outputStreaming.streamFirst }}
  prompts.yml: |
{{ .Files.Get "files/prompts.yml" | indent 4 }}
  rails.co: |
{{ .Files.Get "files/rails.co" | indent 4 }}
{{- end }}

# Browser Route for the OpenClaw Control UI.
# Host matches OpenShell 0.1.6+ {workspace}--{sandbox}--{service} routing.
# TLS: reencrypt (nginx terminates with service-CA cert; router uses cluster cert at the edge).
{{- $workspace := .Values.openshellWorkspace | default "default" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openclaw-ui
  namespace: {{ .Values.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 3600s
spec:
  host: {{ $workspace }}--{{ .Values.sandboxName }}--openclaw-ui.{{ .Values.appsDomain }}
  to:
    kind: Service
    name: openclaw-ui-proxy
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
